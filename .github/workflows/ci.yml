name: CI

on:
  pull_request:
    branches: [dev, main, staging]
  push:
    branches: ["**"]
  repository_dispatch:
    types: [ci-trigger]
  workflow_dispatch:

jobs:
  trigger:
    name: Trigger
    runs-on: ubuntu-latest
    steps:
      - run: echo "CI api déclenché"

  ci:
    needs: trigger
    uses: transummer2026/.github/.github/workflows/ci-service.yml@main
    with:
      service_name: api
      lint_cmd: npx eslint .
      test_cmd: npm test -- --watchAll=false
      build_cmd: npm run build
      audit_cmd: npm audit --audit-level=high
      coverage_cmd: npm test -- --watchAll=false --coverage
      coverage_format: lcov
      coverage_threshold: 0
    secrets:
      OTEL_ENDPOINT: ${{ secrets.OTEL_ENDPOINT }}
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      DISCORD_WEBHOOK_REPO: ${{ secrets.DISCORD_WEBHOOK_API }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
      DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}